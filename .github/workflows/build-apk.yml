name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Use Static Debug Keystore
      run: |
        if [ -f "keystore/debug.keystore" ]; then
          cp keystore/debug.keystore debug.keystore
        else
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Resolve CI version
      id: get_version
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          VERSION_NAME="${GITHUB_REF_NAME#v}"
        else
          VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
        fi
        VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
        echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

    - name: Build with Gradle (Debug APK)
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace \
          -PversionCode=${{ steps.get_version.outputs.VERSION_CODE }} \
          -PversionName=${{ steps.get_version.outputs.VERSION_NAME }}
        cp app/build/outputs/apk/debug/app-debug.apk \
          app/build/outputs/apk/debug/WurieAI-debug-${{ steps.get_version.outputs.VERSION_NAME }}-${{ steps.get_version.outputs.VERSION_CODE }}.apk

    - name: Verify APK Name
      run: ls -la app/build/outputs/apk/debug/

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WurieAI-${{ steps.get_version.outputs.VERSION_NAME }}
        path: app/build/outputs/apk/debug/WurieAI-debug-${{ steps.get_version.outputs.VERSION_NAME }}-${{ steps.get_version.outputs.VERSION_CODE }}.apk

    - name: Create Release
      if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')))
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ steps.get_version.outputs.VERSION_NAME }}-build${{ github.run_number }}"
        name: "WurieAI v${{ steps.get_version.outputs.VERSION_NAME }} (Build #${{ github.run_number }})"
        body: |
          ### Automated Build Release
          - **Version**: ${{ steps.get_version.outputs.VERSION_NAME }}
          - **Build Number**: ${{ github.run_number }}
          - **Commit**: ${{ github.sha }}
          
          Android debug APK generated automatically by GitHub Actions CI/CD.
        files: app/build/outputs/apk/debug/WurieAI-debug-${{ steps.get_version.outputs.VERSION_NAME }}-${{ steps.get_version.outputs.VERSION_CODE }}.apk
        make_latest: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
