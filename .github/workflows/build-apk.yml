name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Copy .env.example to .env
      run: |
        cp .env.example .env
        if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
        fi
        if [ -n "${{ secrets.GEMINI_API_KEY2 }}" ]; then
          echo "GEMINI_API_KEY2=${{ secrets.GEMINI_API_KEY2 }}" >> .env
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Use Static Debug Keystore
      run: |
        if [ -f "keystore/debug.keystore" ]; then
          cp keystore/debug.keystore debug.keystore
        else
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Get Version Name
      id: get_version
      run: |
        VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F'"' '{print $2}')
        if [ -z "$VERSION_NAME" ]; then
          VERSION_NAME="1.4.2"
        fi
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

    - name: Build with Gradle (Debug APK)
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/WurieAI-debug-${{ steps.get_version.outputs.VERSION_NAME }}.apk

    - name: Verify APK Name
      run: ls -la app/build/outputs/apk/debug/

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WurieAI-${{ steps.get_version.outputs.VERSION_NAME }}
        path: app/build/outputs/apk/debug/WurieAI-debug-${{ steps.get_version.outputs.VERSION_NAME }}.apk

    - name: Create Release
      if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ steps.get_version.outputs.VERSION_NAME }}-build${{ github.run_number }}"
        name: "WurieAI v${{ steps.get_version.outputs.VERSION_NAME }} (Build #${{ github.run_number }})"
        body: |
          ### Automated Build Release
          - **Version**: ${{ steps.get_version.outputs.VERSION_NAME }}
          - **Build Number**: ${{ github.run_number }}
          - **Commit**: ${{ github.sha }}
          
          Android debug APK generated automatically by GitHub Actions CI/CD.
        files: app/build/outputs/apk/debug/WurieAI-debug-${{ steps.get_version.outputs.VERSION_NAME }}.apk
        make_latest: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
